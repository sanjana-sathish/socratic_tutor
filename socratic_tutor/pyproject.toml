[project]
name = "socratic-tutor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "sanjana-sathish", email = "sanjanasathishpandy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "torchvision>=0.28.0",
]

[project.scripts]
socratic-tutor = "socratic_tutor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
